[project]
name = "job-companion-backend"
version = "0.1.0"
description = "大学生求职全能搭子智能体 — 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "mem0ai>=0.1.100",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "json-repair>=0.30",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
# S110：多个"尽力而为"路径（SSE 事件、记忆调用、DB 落档失败）有意静默降级，不阻塞主流程
ignore = ["S110"]
